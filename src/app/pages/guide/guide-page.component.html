<header class="section-header"><div class="section-heading"><span>{{portal}} · Help centre</span><h1>The MTRM guide</h1><p>Practical instructions for your everyday training work.</p></div></header>
<div class="guide-layout"><nav class="contents" aria-label="Guide topics"><h2>In this guide</h2><a *ngFor="let section of sections" [routerLink]="[]" [fragment]="section.id">{{section.title}}</a></nav><div class="guide-sections"><article class="guide-card" *ngFor="let section of sections;let i=index" [id]="section.id"><div class="guide-title"><span>{{i+1 | number:'2.0'}}</span><h2>{{section.title}}</h2></div><p>{{section.intro}}</p><ol><li *ngFor="let step of section.steps">{{step}}</li></ol><p class="guide-note">{{section.note}}</p><a class="guide-link" [routerLink]="section.url">{{section.link}} →</a></article></div></div>
